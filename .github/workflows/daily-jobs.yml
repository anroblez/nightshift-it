name: Refresh job matches daily
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_jobs.py
      - name: Commit feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          git diff --cached --quiet || (git commit -m 'Refresh job feed' && git push)
